<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <!-- =====================================================================
       VERSÃO TESTE A: SISTEMA DE PROPORÇÕES SIMPLES (MÚLTIPLOS DE 4 E 8 / BASE 16)
       Todas as coordenadas, larguras, alturas e espessuras obedecem à grade
       modular estrita de 4px / 8px / 16px / 48px:
       - Cortes negativos: 20px (5 x 4px)
       - Pescoço: 24px (6 x 4px)
       - Topo Olhal / Colar: 32px (8 x 4px = 2 x 16px)
       - Espessura do Anel: 48px (12 x 4px = 3 x 16px)
       - Largura do Cabo: 96px (24 x 4px = 6 x 16px = 2 x Anel)
       - Largura do Olhal: 144px (36 x 4px = 9 x 16px = 3 x Anel)
       - Altura da Cabeça: 160px (40 x 4px = 10 x 16px)
       - Alcance Esquerdo (Face Flangiada): -256px (-64 x 4px = -16 x 16px = -2^8)
       - Raio Central do Anel: 336px (84 x 4px = 21 x 16px = 7 x Anel)
       - Alcance Direito (Ponta Carmesim): +400px (100 x 4px = 25 x 16px)
       ===================================================================== -->

  <!-- 1. FUNDO VOID (#09090B) -->
  <rect id="Fundo_Void" width="1000" height="1000" fill="#09090B"/>

  <!-- 2. EIXOS CARTESIANOS SUTIS -->
  <g id="Eixos_Guias">
    <line x1="500" y1="0" x2="500" y2="1000" stroke="#18181B" stroke-width="2"/>
    <line x1="0" y1="448" x2="1000" y2="448" stroke="#18181B" stroke-width="2"/>
  </g>

  <!-- 3. SISTEMA CENTRAL (ORIGEM EM 500, 448 -> 448 = 28 x 16px) -->
  <g id="Martelo_Multiplos_4" transform="translate(500, 448)">

    <!-- A. ANEL EXTERNO: Raio = 336 (21x16) | Espessura = 48 (3x16) | Interno = 312 | Externo = 360 -->
    <path
      id="Anel_Circunferencia"
      d="M 322.25 96.00 A 336 336 0 1 1 310.69 -128.00"
      fill="none"
      stroke="#27272A"
      stroke-width="48"
      stroke-linecap="butt"
    />

    <!-- B. KNOCKOUT DO ANEL INFERIOR: Largura = 136 (34x4), Altura = 80 (20x4) -->
    <rect id="Knockout_Anel_Cabo" x="-68" y="296" width="136" height="80" fill="#09090B"/>

    <!-- C. COLUNA E CABO (MÚLTIPLOS DE 4 E 8) -->
    <g id="Coluna_e_Cabo" fill="#52525B">
      <!-- Topo Olhal: Altura = 32 (8x4), Largura Topo = 128 (-64 a +64), Base = 144 (-72 a +72) -->
      <polygon id="Topo_Olhal" points="-64,-128 64,-128 72,-96 -72,-96"/>

      <!-- Núcleo Central: Largura = 144 (9x16), Altura = 160 (10x16), Eixo Central Y = -16 (-1x16) -->
      <rect id="Nucleo_Olhal" x="-72" y="-96" width="144" height="160"/>

      <!-- Base Olhal: Altura = 24 (6x4), Largura Topo = 144 (-72 a +72), Base = 128 (-64 a +64) -->
      <polygon id="Base_Olhal" points="-72,64 72,64 64,88 -64,88"/>

      <!-- Pescoço do Cabo: Largura = 96 (6x16), Altura = 24 (6x4) -->
      <rect id="Pescoco_Cabo" x="-48" y="88" width="96" height="24"/>

      <!-- Colar Trapezoidal: Altura = 32 (2x16), Largura Topo = 136 (-68 a +68), Base = 104 (-52 a +52) -->
      <polygon id="Colar_Cabo" points="-68,112 68,112 52,144 -52,144"/>

      <!-- Haste Principal: Largura = 96 (6x16), Altura = 272 (17x16, de Y=144 a Y=416) -->
      <rect id="Haste_Cabo" x="-48" y="144" width="96" height="272"/>

      <!-- Pomo Inferior: Altura = 80 (5x16, de Y=416 a Y=496), Largura Máxima = 160 (-80 a +80), Base = 96 (-48 a +48) -->
      <polygon
        id="Pomo_Cabo"
        points="
          -48,416
          48,416
          60,440
          80,440
          48,496
          -48,496
          -80,440
          -60,440
        "
      />
    </g>

    <!-- D. CABEÇA ESQUERDA (BLOCO RETANGULAR):
         Vai de X = -72 até X = -256 (-16x16), com chanfro em X = -224 (-14x16)
         Altura do corpo = 160 (-96 a +64) | Altura da face flangiada = 208 (-120 a +88) -->
    <polygon
      id="Cabeca_Cega_Esquerda"
      fill="#52525B"
      points="
        -72,-96
        -224,-96
        -256,-120
        -256,88
        -224,64
        -72,64
      "
    />

    <!-- E. CABEÇA DIREITA (PONTA TRIANGULAR):
         Base em X = 72 (Y = -96 a +64) e Ponta em X = 400 (25x16), Y = -16 (-1x16) -->
    <polygon
      id="Cabeca_Afiada_Direita"
      fill="#991B1B"
      points="
        72,-96
        400,-16
        72,64
      "
    />

    <!-- F. CORTES DE ESPAÇO NEGATIVO: Stroke = 20px (5x4) -->
    <g id="Cortes_Espaco_Negativo" stroke="#09090B" stroke-width="20" stroke-linecap="butt">
      <line id="Corte_Vertical_Esq" x1="-72" y1="-100" x2="-72" y2="68"/>
      <line id="Corte_Vertical_Dir" x1="72" y1="-100" x2="72" y2="68"/>
      <line id="Corte_Horizontal_Colar" x1="-72" y1="108" x2="72" y2="108"/>
      <line id="Corte_Horizontal_Pomo" x1="-64" y1="416" x2="64" y2="416"/>
    </g>

  </g>
</svg>

