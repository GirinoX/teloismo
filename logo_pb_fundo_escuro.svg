<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <!-- =====================================================================
       O MARTELO TELOÍSTA — VERSÃO MONOCROMÁTICA (P&B PARA FUNDO ESCURO)
       Geometria: Fibonacci / Proporção Áurea (PHI = 1.618)
       - Fundo: #09090B (Preto Void)
       - Anel Secundário: #52525B (Cinza-Aço)
       - Martelo Completo (Corpo + Ponta): #F4F4F5 (Branco Frio Alto Contraste)
       - Cortes Negativos: #09090B (21px - F8)
       ===================================================================== -->

  <rect id="Fundo_Escuro" width="1000" height="1000" fill="#09090B"/>

  <g id="Eixos_Guias">
    <line x1="500" y1="0" x2="500" y2="1000" stroke="#18181B" stroke-width="2"/>
    <line x1="0" y1="445" x2="1000" y2="445" stroke="#18181B" stroke-width="2"/>
  </g>

  <g id="Martelo_PB_Fundo_Escuro" transform="translate(500, 445)">
    <!-- A. ANEL EXTERNO (Cinza-Aço em Segundo Plano) -->
    <path
      id="Anel_Circunferencia"
      d="M 301.95 91.50 A 315.5 315.5 0 1 1 290.15 -124.50"
      fill="none"
      stroke="#52525B"
      stroke-width="55"
      stroke-linecap="butt"
    />

    <!-- B. KNOCKOUT DO ANEL INFERIOR -->
    <rect id="Knockout_Anel_Cabo" x="-65.5" y="278" width="131" height="76" fill="#09090B"/>

    <!-- C. COLUNA E CABO (Branco Frio #F4F4F5) -->
    <g id="Coluna_e_Cabo" fill="#F4F4F5">
      <polygon id="Topo_Olhal" points="-64,-123 64,-123 72,-89 -72,-89"/>
      <rect id="Nucleo_Olhal" x="-72" y="-89" width="144" height="144"/>
      <polygon id="Base_Olhal" points="-72,55 72,55 62,76 -62,76"/>
      <rect id="Pescoco_Cabo" x="-44.5" y="76" width="89" height="21"/>
      <polygon id="Colar_Cabo" points="-65.5,97 65.5,97 49.5,131 -49.5,131"/>
      <rect id="Haste_Cabo" x="-44.5" y="131" width="89" height="280"/>
      <polygon id="Pomo_Cabo" points="-44.5,411 44.5,411 55,432 72,432 44.5,487 -44.5,487 -72,432 -55,432"/>
    </g>

    <!-- D. CABEÇA ESQUERDA (Branco Frio #F4F4F5) -->
    <polygon id="Cabeca_Cega_Esquerda" fill="#F4F4F5" points="-72,-89 -199,-89 -233,-110 -233,76 -199,55 -72,55"/>

    <!-- E. CABEÇA DIREITA (Branco Frio #F4F4F5) -->
    <polygon id="Cabeca_Afiada_Direita" fill="#F4F4F5" points="72,-89 377,-17 72,55"/>

    <!-- F. CORTES DE ESPAÇO NEGATIVO (#09090B - 21px) -->
    <g id="Cortes_Espaco_Negativo" stroke="#09090B" stroke-width="21" stroke-linecap="butt">
      <line id="Corte_Vertical_Esq" x1="-72" y1="-94" x2="-72" y2="60"/>
      <line id="Corte_Vertical_Dir" x1="72" y1="-94" x2="72" y2="60"/>
      <line id="Corte_Horizontal_Colar" x1="-68" y1="92" x2="68" y2="92"/>
      <line id="Corte_Horizontal_Pomo" x1="-60" y1="411" x2="60" y2="411"/>
    </g>
  </g>
</svg>

