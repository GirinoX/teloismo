<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <!-- =====================================================================
       VERSÃO TESTE B: SEQUÊNCIA DE FIBONACCI & PROPORÇÃO ÁUREA (PHI = 1.618)
       Sequência Utilizada: 13, 21, 34, 55, 89, 144, 233, 377, 610
       - Cortes de Espaço Negativo: 21px (F8)
       - Pescoço e Base do Olhal: 21px (F8)
       - Topo do Olhal, Colar e Chanfro Esquerdo: 34px (F9)
       - Projeção da Ponta Carmesim para fora do Anel: 34px (F9)
       - Espessura do Anel: 55px (F10)
       - Respiro entre a Face Esquerda (-233) e o Interior do Anel (-288): 55px (F10)
       - Largura da Haste do Cabo: 89px (F11)
       - Largura do Núcleo Central e Altura da Cabeça: 144px (F12 -> 144/89 = 1.618)
       - Projeção do Cabo/Pomo para fora do Anel Inferior: 144px (F12)
       - Alcance Esquerdo da Cabeça Cega: -233px (F13)
       - Alcance Direito da Ponta Carmesim: +377px (F14 -> 377/233 = 1.618 PHI!)
       - Enquadramento Total do Martelo (Largura x Altura): 610px x 610px (F15 x F15!)
       ===================================================================== -->

  <!-- 1. FUNDO VOID (#09090B) -->
  <rect id="Fundo_Void" width="1000" height="1000" fill="#09090B"/>

  <!-- 2. EIXOS CARTESIANOS E DIVISÃO ÁUREA -->
  <g id="Eixos_Guias">
    <line x1="500" y1="0" x2="500" y2="1000" stroke="#18181B" stroke-width="2"/>
    <line x1="0" y1="445" x2="1000" y2="445" stroke="#18181B" stroke-width="2"/>
  </g>

  <!-- 3. SISTEMA CENTRAL (ORIGEM EM 500, 445) -->
  <g id="Martelo_Fibonacci_Aureo" transform="translate(500, 445)">

    <!-- A. ANEL EXTERNO:
         Espessura = 55px (F10) | Raio Central = 315.5px (Interno = 288px, Externo = 343px)
         Abertura direita de 218px centrada em Y = -17 -->
    <path
      id="Anel_Circunferencia"
      d="M 301.95 91.50 A 315.5 315.5 0 1 1 290.15 -124.50"
      fill="none"
      stroke="#27272A"
      stroke-width="55"
      stroke-linecap="butt"
    />

    <!-- B. KNOCKOUT DO ANEL INFERIOR:
         Cabo (89px) + 2 x 21px (F8) de folga negativa = 131px de largura -->
    <rect id="Knockout_Anel_Cabo" x="-65.5" y="278" width="131" height="76" fill="#09090B"/>

    <!-- C. COLUNA E CABO (PROPORÇÕES DE FIBONACCI) -->
    <g id="Coluna_e_Cabo" fill="#52525B">
      <!-- Topo Olhal: Altura = 34px (F9), de Y = -123 a Y = -89 (-F11) -->
      <polygon id="Topo_Olhal" points="-64,-123 64,-123 72,-89 -72,-89"/>

      <!-- Núcleo Central: Largura = 144px (F12), Altura = 144px (F12, de -89 [-F11] a +55 [+F10]) -->
      <rect id="Nucleo_Olhal" x="-72" y="-89" width="144" height="144"/>

      <!-- Base Olhal: Altura = 21px (F8, de Y = 55 a Y = 76) -->
      <polygon id="Base_Olhal" points="-72,55 72,55 62,76 -62,76"/>

      <!-- Pescoço do Cabo: Largura = 89px (F11), Altura = 21px (F8, de Y = 76 a Y = 97) -->
      <rect id="Pescoco_Cabo" x="-44.5" y="76" width="89" height="21"/>

      <!-- Colar Trapezoidal: Altura = 34px (F9, de Y = 97 a Y = 131), Topo = 131px, Base = 99px -->
      <polygon id="Colar_Cabo" points="-65.5,97 65.5,97 49.5,131 -49.5,131"/>

      <!-- Haste Principal: Largura = 89px (F11), Altura = 280px (de Y = 131 a Y = 411) -->
      <rect id="Haste_Cabo" x="-44.5" y="131" width="89" height="280"/>

      <!-- Pomo Inferior: vai de Y = 411 até Y = 487 (21px ombro + 55px [F10] base;
           Altura total do martelo de -123 a +487 = 610px [F15]!) -->
      <polygon
        id="Pomo_Cabo"
        points="
          -44.5,411
          44.5,411
          55,432
          72,432
          44.5,487
          -44.5,487
          -72,432
          -55,432
        "
      />
    </g>

    <!-- D. CABEÇA ESQUERDA (ALCANCE = -233px [F13]):
         Corpo de X = -72 até -199, Chanfro de 34px (F9) até X = -233 (F13),
         Abas flangiadas expandindo 21px (F8) acima (-110) e abaixo (+76) -->
    <polygon
      id="Cabeca_Cega_Esquerda"
      fill="#52525B"
      points="
        -72,-89
        -199,-89
        -233,-110
        -233,76
        -199,55
        -72,55
      "
    />

    <!-- E. CABEÇA DIREITA (ALCANCE = +377px [F14]):
         Razão Áurea Exata em relação ao lado esquerdo: 377 / 233 = 1.618 (PHI)
         Soma total da cabeça (-233 a +377) = 610px (F15) -->
    <polygon
      id="Cabeca_Afiada_Direita"
      fill="#991B1B"
      points="
        72,-89
        377,-17
        72,55
      "
    />

    <!-- F. CORTES DE ESPAÇO NEGATIVO: Stroke = 21px (F8) -->
    <g id="Cortes_Espaco_Negativo" stroke="#09090B" stroke-width="21" stroke-linecap="butt">
      <line id="Corte_Vertical_Esq" x1="-72" y1="-94" x2="-72" y2="60"/>
      <line id="Corte_Vertical_Dir" x1="72" y1="-94" x2="72" y2="60"/>
      <line id="Corte_Horizontal_Colar" x1="-68" y1="92" x2="68" y2="92"/>
      <line id="Corte_Horizontal_Pomo" x1="-60" y1="411" x2="60" y2="411"/>
    </g>

  </g>
</svg>

